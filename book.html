<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="id title author price">
    <title>book</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        .book-item {
            border: 1px solid #666;
            padding:10px;
            margin:8px 0;
            max-width:300px;
        }
    </style>
</head>
<body>
<h1>Books from XML file</h1>
<div id="bookContainer"></div>
<div id="outputArea"></div>
<script>
    fetch("book.xml")
    .then(function(response){
        return response.text();
    })
    .then(function(xmlText){
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const allBooks = xmlDoc.querySelectorAll("book");
        const container = document.getElementById("bookContainer");
        for(let i=0;i<allBooks.length;i++){
            const oneBook = allBooks[i];
            const bookId = oneBook.getAttribute("id");
            const title = oneBook.querySelector("title").textContent;
            const author = oneBook.querySelector("author").textContent;
            const price = oneBook.querySelector("price").textContent;
            const div = document.createElement("div");
            div.className = "book-item";
            div.innerHTML = `
                Book ID: ${bookId}<br>
                Title: ${title}<br>
                Author: ${author}<br>
                Price: ${price}
            `;
            container.appendChild(div);
        }
    })
    .catch(function(error){
        console.log("Error:", error);
        document.getElementById("outputArea").textContent = "Cannot load XML file.";
    });
</script>
</body>
</html>
